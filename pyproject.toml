[project]
name = "harness"
version = "0.1.0"
description = "A durable agent harness: Sessions on Temporal, domains in Packs"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "temporalio>=1.34.0",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PT", "PL", "RUF", "ANN", "S", "TRY", "PERF", "FBT"]
ignore = ["PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/harness/core/"]
also_copy = ["tests/", "src/harness/__init__.py"]
# Each mutant run starts Temporal's test server (seconds), which per-test timing doesn't see.
timeout_constant = 60.0
